name: Build Adventure Game Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name layth_adventure .
      - name: Download original CC0 platformer art pack
        run: |
          mkdir -p third_party/kenney
          curl -L --fail --retry 3 'https://kenney.nl/media/pages/assets/new-platformer-pack/1896103897-1764756702/kenney_new-platformer-pack-1.1.zip' -o /tmp/kenney-platformer.zip
          unzip -q /tmp/kenney-platformer.zip -d third_party/kenney
          python3 -m pip install --quiet pillow
          python3 tool/extract_assets.py
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: layth-adventure-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
