name: Build Worm Arena Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name worm_arena --org com.wormarena --no-pub .
      - name: Configure Android for 16 KB page-size compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          for file in (settings, app, wrapper):
              if not file.exists():
                  raise SystemExit(f"Expected generated Android file is missing: {file}")

          settings_text = settings.read_text()
          agp = re.search(r'id\("com\.android\.application"\) version "([^"]+)"', settings_text)
          kotlin = re.search(r'id\("org\.jetbrains\.kotlin\.android"\) version "([^"]+)"', settings_text)
          def version_tuple(value):
              return tuple(map(int, value.split("-")[0].split(".")[:3]))

          if not agp or version_tuple(agp.group(1)) < (8, 9, 1):
              raise SystemExit("Android Gradle Plugin 8.9.1 or newer is required by Wortise.")
          if not kotlin or version_tuple(kotlin.group(1)) < (2, 2, 0):
              raise SystemExit("Kotlin 2.2 or newer is required by Wortise.")

          wrapper_text = wrapper.read_text()
          gradle = re.search(r'gradle-([0-9.]+)-(?:all|bin)\.zip', wrapper_text)
          if not gradle or version_tuple(gradle.group(1)) < (8, 11, 1):
              raise SystemExit("Gradle 8.11.1 or newer is required by Wortise.")

          app_text = app.read_text()
          app_text = re.sub(r'compileSdk = flutter\.compileSdkVersion', 'compileSdk = 36', app_text)
          app_text = re.sub(r'minSdk = flutter\.minSdkVersion', 'minSdk = 24', app_text)
          app_text = re.sub(r'ndkVersion = flutter\.ndkVersion', 'ndkVersion = "28.2.13676358"', app_text)
          app.write_text(app_text)

          print("Android configured: compileSdk 36, minSdk 24, NDK r28.")
          print(f"AGP {agp.group(1)}; Kotlin {kotlin.group(1)}; Gradle {gradle.group(1)}.")
          PY
      - name: Install Android NDK r28
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK (retry transient Maven errors)
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"
        run: |
          for attempt in 1 2 3 4 5; do
            echo "APK build attempt $attempt of 5"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              WAIT=$((attempt * 30))
              echo "Build failed; retrying in ${WAIT}s to recover from temporary Maven Central HTTP 429 limits."
              sleep "$WAIT"
            fi
          done
          echo "APK build failed after 5 attempts."
          exit 1
      - name: Verify 16 KB APK alignment
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          NDK_BIN="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/worm-arena-apk
          unzip -q "$APK" -d /tmp/worm-arena-apk
          for ABI in arm64-v8a x86_64; do
            LIB_DIR="/tmp/worm-arena-apk/lib/$ABI"
            [ -d "$LIB_DIR" ] || continue
            find "$LIB_DIR" -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
              "$NDK_BIN/llvm-objdump" -p "$LIB" | awk '
                /LOAD/ {
                  found = 1
                  exponent = $NF
                  if (exponent !~ /^2[*][*][0-9]+$/) {
                    print "Unrecognized ELF LOAD alignment: " exponent
                    bad = 1
                  } else {
                    sub(/^2[*][*]/, "", exponent)
                    if (exponent < 14) {
                      print "ELF LOAD segment is below 16 KB alignment: 2**" exponent
                      bad = 1
                    }
                  }
                }
                END { if (!found) { print "No ELF LOAD segments found"; exit 1 }; if (bad) exit 1 }
              ' || { echo "16 KB ELF alignment failed: $LIB"; exit 1; }
            done
          done
          echo "APK ZIP alignment and 64-bit ELF alignment checks passed."
      - uses: actions/upload-artifact@v4
        with:
          name: worm-arena-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
