name: Build Hospital Simulator Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Import Godot project
        run: godot --headless --editor --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/HospitalSimulator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hospital-simulator-android
          path: build/HospitalSimulator.apk
          if-no-files-found: error
          retention-days: 14
