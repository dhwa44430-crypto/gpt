name: madinati_city_builder
description: Arabic 3D city building game made with Flutter and three_js.
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  three_js: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    assets/models/residencial/
    assets/models/comercial/
    assets/models/industrial/
    assets/models/energia/
    assets/models/parques/
    assets/models/ruas/

